<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento Solar Heating</title><link rel="stylesheet" href="/style.css"><main><section class="panel"><p class="eyebrow">MANUTENZIONE LOCALE</p><h1>Aggiorna il firmware.</h1><p>Verifica che il climatizzatore sia fisicamente spento e confermalo in Diagnostica. Carica solo firmware.bin per la tua scheda. La configurazione LittleFS viene conservata. Usa la LAN o una VPN; non esporre questa pagina a Internet.</p><form id="upload"><label>Firmware .bin<input type="file" id="file" accept=".bin" required></label><div class="controls"><button>Carica firmware</button><a class="button secondary" href="/">Dashboard</a></div></form><progress id="progress" value="0" max="100"></progress><p id="result" role="status"></p></section></main><script>
document.getElementById('upload').onsubmit=async e=>{e.preventDefault();const result=document.getElementById('result'),button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('Autenticazione non riuscita');const state=await r.json();if(state.commanded!=='off')throw Error('Confermare climatizzatore spento in Diagnostica');const file=document.getElementById('file').files[0];if(!file||!file.name.endsWith('.bin')||file.size>state.otaSpace-4096)throw Error('File assente, formato o dimensione non validi');const data=new FormData();data.append('firmware',file);const xhr=new XMLHttpRequest();xhr.open('POST','/update');xhr.setRequestHeader('X-CSRF-Token',state.csrf);xhr.upload.onprogress=e=>{if(e.lengthComputable)document.getElementById('progress').value=e.loaded/e.total*100;};xhr.onload=()=>{result.textContent=xhr.responseText;button.disabled=false;};xhr.onerror=()=>{result.textContent='Connessione interrotta. Verificare versione e stato del dispositivo prima di riprovare.';button.disabled=false;};result.textContent='Caricamento in corso. Non togliere alimentazione.';xhr.send(data);}catch(error){result.textContent=error.message;button.disabled=false;}};
</script></html>
